modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
displayURL="https://www.curseforge.com/minecraft/mc-mods/vault-render-optimization"
updateJSONURL="https://raw.githubusercontent.com/HoYin1600p/The-Vault-Render-Optimization/main/update.json"
displayTest="IGNORE_SERVER_VERSION"
description='''${mod_description}'''

[modproperties."${mod_id}"]
hoyinUpdateNotifier=true
hoyinUpdateName="VRO"

[[dependencies."${mod_id}"]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="CLIENT"

[[dependencies."${mod_id}"]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="CLIENT"

[[dependencies."${mod_id}"]]
modId="the_vault"
mandatory=false
versionRange="[0,)"
ordering="AFTER"
side="CLIENT"
