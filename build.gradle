buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            workingDirectory = project.file('run/client')
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            workingDirectory = project.file('run/server')
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
    }
}

mixin {
    add sourceSets.main, "mixins.${mod_id}.refmap.json"
    config "mixins.${mod_id}.json"
    config "mixins.${mod_id}.flywheel.json"
    config "mixins.${mod_id}.oculus.json"
    config "mixins.${mod_id}.flywheel_forge.json"
    config "mixins.${mod_id}.immediatelyfast.json"
}

repositories {
    maven {
        name = 'sponge'
        url = 'https://repo.spongepowered.org/maven'
    }
    maven {
        // Cloth Config: optional settings-screen dependency, compiled against only, never shaded.
        name = 'shedaniel'
        url = 'https://maven.shedaniel.me/'
    }
    maven {
        // CurseMaven: any CurseForge file as curse.maven:<slug>-<projectId>:<fileId>.
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    maven {
        // Flywheel, the copy Create bundles; nothing else is taken from this repository.
        name = 'ModMaven'
        url = 'https://modmaven.dev/'
        content { includeGroup 'com.jozufozu.flywheel' }
    }
    mavenCentral()
}

// cursemaven-helper:start
// Mod dependencies come from CurseForge through CurseMaven, so anyone can build this mod; the file ids
// are in gradle.properties. To build against a local jar while developing, pass its path:
// -Pvault_mod_jar=path/to/the_vault.jar (or set it in ~/.gradle/gradle.properties). Never commit an override.
def modDep = { String property, String coordinate ->
    def local = findProperty(property)
    if (local) {
        def f = file(local)
        if (!f.isFile()) throw new GradleException("-P${property}=${local} does not exist")
        return files(f)
    }
    return fg.deobf(coordinate)
}
// The published bytes, not remapped: for tests that run a renderer's own code as an oracle.
def rawDep = { String property, String coordinate ->
    def local = findProperty(property)
    if (local) {
        def f = file(local)
        if (!f.isFile()) throw new GradleException("-P${property}=${local} does not exist")
        return files(f)
    }
    return coordinate
}
// cursemaven-helper:end

// The same file as it is published, for tasks and tests that read a mod's exact bytes. Resolved only
// when a task runs; the same -P<property> override applies.
def rawModJar = { String property, String coordinate ->
    def local = findProperty(property)
    if (local) {
        def f = file(local)
        if (!f.isFile()) throw new GradleException("-P${property}=${local} does not exist")
        return f
    }
    def jar = configurations.detachedConfiguration(dependencies.create(coordinate))
    jar.transitive = false
    return jar.singleFile
}

def vaultCoordinate = "curse.maven:vault-hunters-official-mod-458203:${vault_hunters_file}"
def renderCoordinate = "curse.maven:rubidium-574856:${rubidium_file}"
// CCLCompat is Embeddium-only, but the same source set must also compile while the active
// compatibility target is Rubidium, so one Embeddium jar stays on the compile-only classpath.
def embeddiumCoordinate = "curse.maven:embeddium-908741:${embeddium_file}"
def createCoordinate = "curse.maven:create-328085:${create_file}"
def oculusCoordinate = "curse.maven:oculus-581495:${oculus_file}"
def geckoLibCoordinate = "curse.maven:geckolib-388172:${geckolib_file}"
// Ars Nouveau shades its own GeckoLib 3 copy; Citadel (Alex's Mobs) has its own model boxes.
def arsNouveauCoordinate = "curse.maven:ars-nouveau-401955:${ars_nouveau_file}"
def citadelCoordinate = "curse.maven:citadel-331936:${citadel_file}"

def createRawJar = providers.provider { rawModJar('create_jar', createCoordinate) }
def indexSortTestJar = providers.provider { rawModJar('index_sort_test_jar', embeddiumCoordinate) }
def oculusRawJar = providers.provider { rawModJar('oculus_mod_jar', oculusCoordinate) }
// The Flywheel build Create 0.5.1i bundles, byte-identical to the one published on modmaven.dev.
def flywheelCoordinate = "com.jozufozu.flywheel:flywheel-forge-1.18.2:${flywheel_version}"

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    compileOnly modDep('vault_mod_jar', vaultCoordinate)
    compileOnly modDep('embeddium_compile_jar', embeddiumCoordinate)
    compileOnly modDep('render_mod_jar', renderCoordinate)
    compileOnly modDep('vault_loot_beams_jar', "curse.maven:vaultlootbeams-1313069:${vault_loot_beams_file}")
    compileOnly modDep('ispawner_jar', "curse.maven:ispawner-533792:${ispawner_file}")
    compileOnly modDep('architectury_jar', "curse.maven:architectury-api-419699:${architectury_file}")
    compileOnly modDep('create_jar', createCoordinate)
    compileOnly modDep('codechickenlib_jar', "curse.maven:codechicken-lib-1-8-242818:${codechickenlib_file}")
    compileOnly modDep('sophisticated_storage_jar', "curse.maven:sophisticated-storage-619320:${sophisticated_storage_file}")
    compileOnly modDep('sophisticated_core_jar', "curse.maven:sophisticated-core-618298:${sophisticated_core_file}")
    compileOnly(flywheelCoordinate) { transitive = false }
    compileOnly modDep('oculus_mod_jar', oculusCoordinate)
    compileOnly modDep('geckolib_jar', geckoLibCoordinate)
    compileOnly modDep('ars_nouveau_jar', arsNouveauCoordinate)
    compileOnly modDep('citadel_jar', citadelCoordinate)
    // The oldest Cloth Config the supported packs ship; VRO loads and runs without it.
    compileOnly fg.deobf("me.shedaniel.cloth:cloth-config-forge:${cloth_config_version}")

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    // Exercise the actual optional renderer contracts without packaging it into VRO.
    testImplementation rawDep('index_sort_test_jar', embeddiumCoordinate)
    testImplementation(flywheelCoordinate) { transitive = false }
    // Oculus' own NormalHelper is the oracle for the shader-pack (extended vertex) GPU path; it calls Mth.
    testImplementation modDep('oculus_mod_jar', oculusCoordinate)
    // GeckoLib's own IGeoRenderer.renderCube is the oracle for the GeckoLib GPU path.
    testImplementation modDep('geckolib_jar', geckoLibCoordinate)
    // Ars Nouveau's shaded GeckoLib and Citadel's AdvancedModelBox are the oracles for their GPU paths.
    testImplementation modDep('ars_nouveau_jar', arsNouveauCoordinate)
    testImplementation modDep('citadel_jar', citadelCoordinate)
}

// Optional local jars for extra renderer contract tests; nothing is searched for on disk.
// -Pcustom_embeddium_jar=path checks HoYin1600p's custom Embeddium build against every renderer hash contract
// (-Prequire_custom_renderer_tests=true makes a missing jar a failure); -Poculus_contract_jars adds Oculus
// builds (path-separated) to the shader-compat contract check alongside the public Oculus jar.
def customEmbeddiumTestJar = findProperty('custom_embeddium_jar') ? file(findProperty('custom_embeddium_jar')) : null
def extraOculusContractJars = (findProperty('oculus_contract_jars') ?: '').tokenize(File.pathSeparator).collect { file(it) }
tasks.named('test') {
    useJUnitPlatform()
    if (customEmbeddiumTestJar != null && customEmbeddiumTestJar.isFile()) {
        systemProperty 'vro.indexSort.customRenderer', customEmbeddiumTestJar.absolutePath
    } else if (findProperty('require_custom_renderer_tests') == 'true') {
        throw new GradleException('The custom Embeddium jar was not found. Set -Pcustom_embeddium_jar=path/to/embeddium.jar.')
    }
    doFirst {
        def oculusContractJars = ([oculusRawJar.get()] + extraOculusContractJars)
                .findAll { it.isFile() }.unique { it.canonicalPath }
        systemProperty 'vro.indexSort.rawRenderer', indexSortTestJar.get().absolutePath
        systemProperty 'vro.flywheel.rawCreate', createRawJar.get().absolutePath
        systemProperty 'vro.oculus.contractJars', oculusContractJars*.absolutePath.join(File.pathSeparator)
    }
}
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version: forge_version,
            forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description,
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    archiveFileName = "${mod_id}.${mod_version}.jar"

    from(rootProject.file('THIRD_PARTY_NOTICES.md')) {
        into 'META-INF'
    }

    from(rootProject.file('CREDITS.md')) {
        into 'META-INF'
    }

    from(rootProject.file('LICENSE')) {
        into 'META-INF'
    }

    from(rootProject.file('docs/licenses/iris-flw-compat-MIT.txt')) {
        into 'META-INF/licenses'
    }

    from(rootProject.file('docs/licenses/forge-update-notifier-MIT.txt')) {
        into 'META-INF/licenses'
    }

    from(rootProject.file('docs/licenses/modernfix-LGPL-3.0-or-later.txt')) {
        into 'META-INF/licenses'
    }

    from(rootProject.file('docs/licenses/flerovium-LGPL-3.0.txt')) {
        into 'META-INF/licenses'
    }
    from(rootProject.file('docs/licenses/embeddium-LGPL-3.0-only.txt')) {
        into 'META-INF/licenses'
    }
    from(rootProject.file('docs/licenses/immediatelyfast-LGPL-3.0-or-later.txt')) {
        into 'META-INF/licenses'
    }
    from(rootProject.file('docs/licenses/accelerated-rendering-MIT.txt')) {
        into 'META-INF/licenses'
    }

    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : mod_authors,
                "MixinConfigs"            : "mixins.${mod_id}.json,mixins.${mod_id}.flywheel.json,mixins.${mod_id}.oculus.json,mixins.${mod_id}.flywheel_forge.json,mixins.${mod_id}.immediatelyfast.json"
        ])
    }

    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
