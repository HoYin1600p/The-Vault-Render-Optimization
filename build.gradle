buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            workingDirectory = project.file('run/client')
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            workingDirectory = project.file('run/server')
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
    }
}

mixin {
    add sourceSets.main, "mixins.${mod_id}.refmap.json"
    config "mixins.${mod_id}.json"
}

repositories {
    maven {
        name = 'sponge'
        url = 'https://repo.spongepowered.org/maven'
    }
}

def prismInstancesDirectory = new File(System.getProperty('user.home'), 'AppData/Roaming/PrismLauncher/instances')
def knownVaultInstances = [
        [name: 'VaultCrafters Bootstrap', folder: 'vaultcrafters-bootstrap-1.0.0', minecraft: '.minecraft'],
        [name: 'Asgard-SMP', folder: 'Asgard-SMP', minecraft: 'minecraft'],
        [name: 'Wolds Vaults', folder: 'Wolds-Vaults-0.32.2', minecraft: 'minecraft'],
        [name: 'Vault Hunters Third Edition', folder: 'Vault Hunters Third Edition', minecraft: 'minecraft'],
]

def discoveredVaultModJars = knownVaultInstances.collect { instance ->
    def modsDirectory = new File(prismInstancesDirectory, "${instance.folder}/${instance.minecraft}/mods")
    def candidates = modsDirectory.listFiles()?.findAll {
        it.isFile() && it.name.startsWith('the_vault-') && it.name.endsWith('.jar')
    } ?: []

    if (candidates.size() > 1) {
        throw new GradleException("More than one active The Vault jar was found for ${instance.name}: ${candidates*.name}")
    }

    candidates ? [name: instance.name, jar: candidates.first()] : null
}.findAll { it != null }

def defaultVaultModJar = discoveredVaultModJars.find { it.name == 'Vault Hunters Third Edition' }?.jar
        ?: discoveredVaultModJars.first()?.jar
def configuredVaultModJar = findProperty('vault_mod_jar') ?: defaultVaultModJar
if (configuredVaultModJar == null) {
    throw new GradleException('No The Vault mod jar was discovered. Set -Pvault_mod_jar=path/to/the_vault.jar.')
}

def vaultModJarFile = file(configuredVaultModJar)
if (!vaultModJarFile.exists()) {
    throw new GradleException("The Vault mod jar was not found at ${vaultModJarFile}. Set -Pvault_mod_jar=path/to/the_vault.jar if your instance path differs.")
}

def discoveredRenderModJar = knownVaultInstances.collect { instance ->
    def modsDirectory = new File(prismInstancesDirectory, "${instance.folder}/${instance.minecraft}/mods")
    def candidates = modsDirectory.listFiles()?.findAll {
        it.isFile()
                && it.name ==~ /^(embeddium|rubidium)-[0-9].*\.jar$/
    } ?: []
    candidates ? candidates.first() : null
}.find { it != null }
def configuredRenderModJar = findProperty('render_mod_jar') ?: discoveredRenderModJar
if (configuredRenderModJar == null) {
    throw new GradleException('No Embeddium or Rubidium jar was discovered. Set -Prender_mod_jar=path/to/render-mod.jar.')
}

def renderModJarFile = file(configuredRenderModJar)
if (!renderModJarFile.exists()) {
    throw new GradleException("The renderer mod jar was not found at ${renderModJarFile}. Set -Prender_mod_jar if your instance path differs.")
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    compileOnly files(vaultModJarFile)
    compileOnly files(renderModJarFile)
}

tasks.register('printVaultCompatibilityTargets') {
    group = 'verification'
    description = 'Prints the discovered Vault Hunters jars used by the compatibility build matrix.'
    doLast {
        discoveredVaultModJars.each { target ->
            println "${target.name}: ${target.jar}"
        }
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version: forge_version,
            forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description,
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    archiveFileName = "${mod_id}.${mod_version}.jar"

    from(rootProject.file('THIRD_PARTY_NOTICES.md')) {
        into 'META-INF'
    }

    from(rootProject.file('LICENSE')) {
        into 'META-INF'
    }

    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs"            : "mixins.${mod_id}.json"
        ])
    }

    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
